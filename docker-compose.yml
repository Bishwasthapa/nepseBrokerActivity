services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quantpass
      POSTGRES_DB: nepse_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d nepse_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data/real:/app/data/real
      - ./reports:/app/reports
      - ./models:/app/models
    environment:
      DATABASE_URL: postgresql://quant:quantpass@db:5432/nepse_analytics
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env
    command: ["python", "-m", "src.cli", "run"]

volumes:
  pgdata:
